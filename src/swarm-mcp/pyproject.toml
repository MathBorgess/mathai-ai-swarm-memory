[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathai-swarm-mcp"
version = "0.0.1"
description = "Local MCP adapter for the mathai swarm context broker (DPoP Device Flow client)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27,<1",
    "cryptography>=42",
    "PyJWT[crypto]>=2.10,<3",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "anyio>=4"]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
mathai-swarm-mcp = "mathai_swarm_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["mathai_swarm_mcp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.anyio]
backends = ["asyncio"]
